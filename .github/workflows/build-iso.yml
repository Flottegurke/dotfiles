name: Build and publish installer ISO

on:
  push:
    branches: [main]
    paths:
      - "parts/isos.nix"
      - "secrets/keys.nix"
      - "secrets/keys-data.nix"
      - "hosts/**/default.nix"
      - "flake.lock"
      - "flake.nix"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ISO_VERSION: "1.0"

concurrency:
  group: installer-iso-release
  cancel-in-progress: false

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine ISO release version
        id: version
        shell: bash
        run: |
          TAG_PREFIX="iso-v${ISO_VERSION}."

          REMOTE_TAGS="$(
            git ls-remote --tags origin "refs/tags/${TAG_PREFIX}*"
          )"

          LAST="$(
            printf '%s\n' "$REMOTE_TAGS" |
              awk -v prefix="refs/tags/${TAG_PREFIX}" '
                {
                  ref = $2
                  sub(/\^\{\}$/, "", ref)

                  if (index(ref, prefix) == 1) {
                    number = substr(ref, length(prefix) + 1)

                    if (number ~ /^[0-9]+$/) {
                      print number
                    }
                  }
                }
              ' |
              sort -n |
              tail -1
          )"

          if [[ -z "$LAST" ]]; then
            NEXT=0
          else
            NEXT=$((LAST + 1))
          fi

          VERSION="${ISO_VERSION}.${NEXT}"
          TAG="iso-v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Building installer ISO $VERSION"

      - name: Install NixOS
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Pull Cache
        uses: cachix/cachix-action@v17
        with:
          name: flottegurke-dotfiles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.installer-iso.config.system.build.isoImage  --print-out-paths > iso-path.txt

          echo "ISO_PATH=$(cat iso-path.txt)/iso" >> "$GITHUB_ENV"

      - name: Find ISO file
        run: |
          ISO_FILE=$(find "$ISO_PATH" -name '*.iso')
          echo "ISO_FILE=$ISO_FILE" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Installer ISO v${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: ${{ env.ISO_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
